[package]
name = "agent-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bytes = "1"
dotenvy = "0.15"
futures-util = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1"
