# Audio Clipping host on Fly.io (Browser Run + free local)
# Build happens in the cloud — do not build on a full Mac disk.
#
#   fly launch --config fly.inkling.toml --no-deploy
#   fly deploy --config fly.inkling.toml
#
# Then open https://<app>.fly.dev/audio-clipping
# Optional: fly secrets set TOGETHER_API_KEY=…  (Inkling; omit for free local)

app = 'aileena-clips'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.inkling'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'
