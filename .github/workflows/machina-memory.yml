# Aileena Machina — weekly / manual Dreaming (ReMeLight)
# Article path trigger lives in memory-on-article.yml (fixed paths).

name: Machina Memory (Dreaming)

on:
  schedule:
    # Mondays 06:00 UTC — offline compression, no GPU
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      skip_commit:
        description: 'Run dreaming + index only (no git push)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: machina-memory-dreaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dreaming:
    uses: ./.github/workflows/machina-memory-job.yml
    with:
      reason: ${{ github.event_name }}
      skip_commit: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_commit == 'true' }}
    secrets: inherit
