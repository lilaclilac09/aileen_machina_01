name: Site-agent live evolve

# Drain uncovered visitor asks from production Redis via GitHub OIDC
# (no UPSTASH secret on GitHub), then ratchet skills.
# Promote only if held-out rises AND the trigger-quality gate passes.
# Never pushes to main: changes land as a PR labelled `self-improve`, gated by
# a real-agent replay (next start + DeepSeek) of the prompts the changed
# skills trigger on plus every held-out prompt. Without DEEPSEEK_API_KEY the
# replay is skipped and the PR stays a draft labelled `replay-skipped`; run
# "Site-agent replay gate" (site-agent-replay.yml) on it once the secret exists.
# Promotions are revertible: `pnpm evolve -- --rollback <skill> --to <version>`.
# Never commits AGENTS.md / QA.md / PROJECT_RULES.md.

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: site-agent-live-evolve
  cancel-in-progress: false

jobs:
  evolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aileena-new

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: aileena-new/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Drain production inbox (OIDC)
        env:
          DRAIN_URL: https://www.aileena.xyz/api/evolve/drain
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://www.aileena.xyz" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsSL -X POST "$DRAIN_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            -o /tmp/evolve-asks.json
          # The drain is checkpointed per run_id (action ledger): "Re-run jobs" gets
          # the same asks back, and asks of an earlier run that never acked are adopted.
          python3 -c 'import json; raw=json.load(open("/tmp/evolve-asks.json")); asks=raw.get("asks") if isinstance(raw, dict) else raw; print("drained", len(asks) if isinstance(asks, list) else 0, "ask(s)", "replay" if isinstance(raw, dict) and raw.get("replay") else "", "adopted", raw.get("adopted", 0) if isinstance(raw, dict) else 0)'

      - name: Ingest drained asks + ratchet
        run: pnpm evolve -- --from-asks /tmp/evolve-asks.json

      - name: Refresh effect sheet
        run: pnpm evolve:effect

      - name: Restore constitution if touched
        working-directory: .
        run: |
          git checkout -- AGENTS.md QA.md PROJECT_RULES.md 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "Site Agent Evolve Bot"
          git config user.email "bot@aileena.xyz"

      - name: Commit skills to a self-improve branch
        id: commit
        working-directory: .
        run: |
          set -euo pipefail
          git add \
            ops/evolution \
            aileena-new/lib/evolution/activeSkills.generated.ts
          if git diff --cached --name-only | grep -E '^(AGENTS\.md|QA\.md|PROJECT_RULES\.md)$'; then
            echo "::error::constitution files staged — refusing commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No skill changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Action-Id from stable inputs (drained asks + generated skill table), never
          # from time or run id: a re-run or a later run with the same result maps to
          # the same branch, commit trailer and PR, so nothing is opened twice.
          ACTION_ID="evolve-$( { python3 -c 'import json; raw=json.load(open("/tmp/evolve-asks.json")); asks=raw.get("asks") if isinstance(raw, dict) else raw; print(json.dumps(sorted(a.get("prompt","") if isinstance(a, dict) else str(a) for a in (asks or []))))'; git show :aileena-new/lib/evolution/activeSkills.generated.ts; } | sha256sum | cut -c1-24)"
          BRANCH="self-improve/${ACTION_ID}"
          echo "action_id=$ACTION_ID" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Checkpoint: this commit was already pushed by an earlier attempt. Resume from there.
            echo "Action-Id ${ACTION_ID}: branch already pushed, skipping commit"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$BRANCH"
          git commit -m "chore(evolve): ratchet skills from live chat inbox [$(date -u +%Y-%m-%d)]" -m "Action-Id: ${ACTION_ID}"
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      - name: Real-agent replay gate
        id: replay
        if: steps.commit.outputs.changed == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUNTIME_KV: memory
        run: |
          set +e
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo '{"skipped":true,"reason":"no DEEPSEEK_API_KEY secret"}' > /tmp/evolve-replay.json
            exit 0
          fi
          pnpm build > /tmp/build.log 2>&1 || { tail -50 /tmp/build.log; echo "status=build_failed" >> "$GITHUB_OUTPUT"; exit 1; }
          (pnpm start -p 3123 > /tmp/start.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3123/ && break; sleep 2; done
          pnpm evolve:replay -- --base http://localhost:3123 --changed-from origin/main --out /tmp/evolve-replay.json
          code=$?
          if [ $code -eq 0 ]; then echo "status=passed" >> "$GITHUB_OUTPUT"; else echo "status=failed" >> "$GITHUB_OUTPUT"; fi
          exit $code

      - name: Open self-improve PR
        if: steps.commit.outputs.changed == 'true' && (steps.replay.outputs.status == 'passed' || steps.replay.outputs.status == 'skipped')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          REPLAY: ${{ steps.replay.outputs.status }}
          ACTION_ID: ${{ steps.commit.outputs.action_id }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          set -euo pipefail
          if [ "$PUSHED" != "true" ]; then git push origin "$BRANCH"; fi
          EXISTING=$(gh pr list --head "$BRANCH" --state all --json number,state -q '.[0] | select(.) | "#\(.number) \(.state)"')
          if [ -n "$EXISTING" ]; then
            echo "Action-Id ${ACTION_ID}: PR already exists (${EXISTING}), not opening another"
            exit 0
          fi
          gh label create self-improve --color 5319e7 --description "Evolution loop skill ratchet" --force
          gh label create replay-skipped --color fbca04 --description "Real-agent replay did not run" --force
          {
            echo "Automated skill ratchet from the live chat inbox."
            echo
            echo "- Held-out must rise; trigger-quality gate enforced by the ratchet."
            echo "- Real-agent replay: **${REPLAY}**"
            echo "- Revert a promotion: \`pnpm evolve -- --rollback <skill> --to <version>\`"
            echo "- Action-Id: \`${ACTION_ID}\`"
            echo
            echo '```json'
            head -c 6000 /tmp/evolve-replay.json
            echo
            echo '```'
          } > /tmp/pr-body.md
          ARGS=(--base main --head "$BRANCH" --title "self-improve: skill ratchet $(date -u +%Y-%m-%d)" --body-file /tmp/pr-body.md --label self-improve)
          if [ "$REPLAY" != "passed" ]; then ARGS+=(--draft --label replay-skipped); fi
          gh pr create "${ARGS[@]}"

      - name: Ack drain checkpoint
        # Only after the PR step (or no change), or when the replay gate rejected the
        # change: the drained asks are consumed. A run that crashes before this point
        # leaves them for the next run to adopt (within 24 h).
        if: success() || steps.replay.outputs.status == 'failed'
        env:
          DRAIN_URL: https://www.aileena.xyz/api/evolve/drain?ack=1
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://www.aileena.xyz" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsSL -X POST "$DRAIN_URL" -H "Authorization: Bearer $TOKEN" -H "Accept: application/json"
