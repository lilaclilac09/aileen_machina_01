name: Site-agent live evolve

# Drain uncovered visitor asks from production Redis via GitHub OIDC
# (no UPSTASH secret on GitHub), then ratchet skills.
# Promote only if held-out rises.
# Never commits AGENTS.md / QA.md / PROJECT_RULES.md.

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: site-agent-live-evolve
  cancel-in-progress: false

jobs:
  evolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aileena-new

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: aileena-new/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Drain production inbox (OIDC)
        env:
          DRAIN_URL: https://www.aileena.xyz/api/evolve/drain
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://www.aileena.xyz" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsSL -X POST "$DRAIN_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            -o /tmp/evolve-asks.json
          python3 -c 'import json; raw=json.load(open("/tmp/evolve-asks.json")); asks=raw.get("asks") if isinstance(raw, dict) else raw; print("drained", len(asks) if isinstance(asks, list) else 0, "ask(s)")'

      - name: Ingest drained asks + ratchet
        run: pnpm evolve -- --from-asks /tmp/evolve-asks.json

      - name: Refresh effect sheet
        run: pnpm evolve:effect

      - name: Restore constitution if touched
        working-directory: .
        run: |
          git checkout -- AGENTS.md QA.md PROJECT_RULES.md 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "Site Agent Evolve Bot"
          git config user.email "bot@aileena.xyz"

      - name: Commit skills only
        working-directory: .
        run: |
          set -euo pipefail
          git add \
            ops/evolution \
            aileena-new/lib/evolution/activeSkills.generated.ts
          if git diff --cached --name-only | grep -E '^(AGENTS\.md|QA\.md|PROJECT_RULES\.md)$'; then
            echo "::error::constitution files staged — refusing commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No skill changes to commit"
            exit 0
          fi
          git commit -m "chore(evolve): ratchet skills from live chat inbox [$(date -u +%Y-%m-%d)]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Evolve skills pushed (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push evolve skills after retries"
          exit 1
