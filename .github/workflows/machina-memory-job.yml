# Shared Machina memory job — called by weekly Dreaming + fixed-path article trigger.
# Do not dispatch this file directly.

name: Machina Memory Job

on:
  workflow_call:
    inputs:
      reason:
        description: 'Label for commit message (push|schedule|workflow_dispatch|article-path)'
        type: string
        required: false
        default: 'manual'
      skip_commit:
        description: 'If true, run sync+dreaming but do not push'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  dreaming:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aileena-new

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: aileena-new/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync carousel + latest content → L3 memory
        run: pnpm sync:content-memory

      - name: Dreaming (offline consolidate + social digest)
        run: pnpm dreaming

      - name: Rebuild memory index (L2)
        run: pnpm build:memory-index

      - name: Configure Git
        if: ${{ !inputs.skip_commit }}
        run: |
          git config user.name "Machina Memory Bot"
          git config user.email "bot@aileena.xyz"

      - name: Commit Dreaming report + content memory
        if: ${{ !inputs.skip_commit }}
        working-directory: .
        env:
          MEMORY_REASON: ${{ inputs.reason }}
        run: bash .github/scripts/push-generated-memory.sh
